<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>random topik</title>

  <!-- Japonca için Noto Sans JP. Google Fonts unicode-range ile parçalara
       böldüğü için dosya yalnızca Japonca karakter ekrana geldiğinde iner;
       tr/eng kullanırken hiçbir şey indirilmez. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap">

  <!-- CSS dosyaları sırayla yüklenir: önce temel, sonra düzen, sonra paneller -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/tabs.css">
  <link rel="stylesheet" href="css/panel-about.css">
  <link rel="stylesheet" href="css/panel-main.css">
  <link rel="stylesheet" href="css/panel-log.css">
  <link rel="stylesheet" href="css/panel-collection.css">
  <link rel="stylesheet" href="css/scroll-rail.css">
</head>
<body>
  <main class="app">

    <!-- ============ SOL: bu site neden var? ============ -->
    <section class="panel panel--about">
      <h2 class="panel__title" data-i18n="aboutTitle"></h2>
      <div class="about" id="about"></div>
    </section>

    <!-- ============ ORTA: dil + slot ============ -->
    <section class="panel panel--main">
      <header class="main__head">
        <!-- dil dropdown'ı buraya JS ile basılır -->
        <div class="lang" id="lang"></div>

        <div class="main__brand">
          <!-- versiyon aynı zamanda depo linki -->
          <a class="main__version" id="version" target="_blank" rel="noopener noreferrer"></a>
          <h1 class="main__title" data-i18n="siteTitle"></h1>
        </div>
      </header>

      <div class="main__body">
        <div class="slot">
          <div class="slot__viewport">
            <div class="slot__reel" id="slot-reel"></div>
          </div>
          <!-- ortadaki kelimeyi çerçeveleyen iki ince çizgi -->
          <span class="slot__marker slot__marker--top" aria-hidden="true"></span>
          <span class="slot__marker slot__marker--bottom" aria-hidden="true"></span>
        </div>

        <!-- ekran okuyucular için: sonuç sadece slot durunca duyurulur -->
        <p class="sr-only" id="slot-result" aria-live="polite" role="status"></p>

        <button class="again" id="again" type="button" data-i18n="again"></button>
      </div>
    </section>

    <!-- ============ SAĞ: kayıt + koleksiyon ============
         Masaüstünde ikili sekme; mobilde sarmalayıcı `display: contents` ile
         yok olur ve iki bölme ayrı birer tam ekran panel olur (layout.css). -->
    <div class="panel panel--side">
      <div class="tabs" id="tabs"></div>   <!-- sekme düğmeleri JS ile basılır -->

      <section class="pane pane--log pane--active" id="pane-log">
        <div class="pane__head">
          <h2 class="pane__title" data-i18n="logTitle"></h2>
        </div>
        <div class="log__scroll">
          <ol class="log" id="log-list"></ol>
          <p class="log__empty" id="log-empty" data-i18n="logEmpty"></p>
        </div>
      </section>

      <section class="pane pane--collection" id="pane-collection">
        <div class="pane__head">
          <h2 class="pane__title" data-i18n="collectionTitle"></h2>
          <span class="collection__count" id="collection-count"></span>
        </div>
        <!-- kareler sözlükten türetilir; sayaç bilgiyi zaten yazıyor,
             o yüzden ızgara ekran okuyucuya tekrar okutulmuyor -->
        <ul class="collection" id="collection" aria-hidden="true"></ul>
      </section>
    </div>

  </main>

  <!-- mobildeki kaydırma göstergesi (üstte durur, yer kaplamaz) -->
  <div class="scroll-rail" id="scroll-rail" aria-hidden="true">
    <div class="scroll-rail__thumb" id="scroll-rail-thumb"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
